[project]
name = "pr-sentinel"
version = "0.1.0"
description = "A selective, evidence-grounded multi-agent pull-request reviewer with a human-in-the-loop gate."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "asyncpg>=0.30",
  "redis>=5.2",
  "arq>=0.26",
  "httpx>=0.27",
  "anthropic>=0.40",
  "structlog>=24.4",
  "typer>=0.15",
  "jinja2>=3.1",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
local-embeddings = ["model2vec>=0.9"]
langgraph = ["langgraph>=0.2.50"]
openai = ["openai>=1.55"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "respx>=0.21",
]

[project.scripts]
pr-sentinel = "pr_sentinel.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pr_sentinel = ["llm/prompts/*.md", "dashboard/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a live Postgres/Redis (docker compose up -d)",
  "live_llm: spends real money against the Anthropic API",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]

[tool.mypy]
python_version = "3.11"
packages = ["pr_sentinel"]
ignore_missing_imports = true
