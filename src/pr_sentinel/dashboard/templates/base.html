<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}pr-sentinel{% endblock %}</title>
<style>
  :root{--bg:#fbfbfa;--fg:#1a1a18;--muted:#6b6b66;--line:#e4e4e0;--card:#fff;
        --crit:#c0392b;--major:#d97706;--minor:#8a8a00;--info:#3b6ea5;--ok:#2d7a4f;}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#161614;--fg:#eceae4;--muted:#9a9a92;--line:#2c2c28;--card:#1e1e1b;}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:32px 16px}
  h1{font-size:20px;margin:0 0 4px} h2{font-size:15px;margin:32px 0 10px;
    text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .sub{color:var(--muted);margin:0 0 24px;font-size:13px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
  .card .n{font-size:24px;font-variant-numeric:tabular-nums} .card .l{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;background:var(--card);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  tr:last-child td{border-bottom:0} code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  a{color:inherit} .p1{color:var(--crit);font-weight:600}
  .sev-critical{color:var(--crit);font-weight:600} .sev-major{color:var(--major);font-weight:600}
  .sev-minor{color:var(--minor)} .sev-info{color:var(--info)}
  form{display:flex;gap:6px} button{font:inherit;font-size:12px;padding:4px 10px;
    border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--fg);cursor:pointer}
  button:hover{border-color:var(--muted)} .empty{color:var(--muted);padding:20px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:13px}
  pre{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:12px;overflow-x:auto;font-size:12px}
</style>
</head>
<body><div class="wrap">
<nav style="display:flex;gap:16px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:16px;font-size:13px">
  <a href="/">Queue</a>
  <a href="/costs">Costs</a>
  <a href="/feedback">Feedback</a>
</nav>
{% block body %}{% endblock %}</div></body>
</html>
