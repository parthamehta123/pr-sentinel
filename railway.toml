[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "webhook"
startCommand = "uvicorn pr_sentinel.ingress.app:app --host 0.0.0.0 --port $PORT"

[[services]]
name = "worker"
startCommand = "python -m pr_sentinel.cli worker"

[[services]]
name = "dashboard"
startCommand = "uvicorn pr_sentinel.dashboard.app:app --host 0.0.0.0 --port $PORT"
